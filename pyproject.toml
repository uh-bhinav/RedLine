[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbench"
version = "0.3.0"
description = "Agent Reliability Engineering — automated evaluation, deployment gating, and reliability scoring for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Abhinav Mahesh Gurkar" }]
keywords = ["llm", "agents", "evaluation", "ci-cd", "reliability", "sre", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

# Base dependencies are the CLI's ONLY. Installing `agentbench` must not drag in
# psycopg2, confluent-kafka, or clickhouse-driver -- a user pointing the CLI at a
# hosted RedLine has no database, no broker, and (on many machines) no libpq to
# compile against.
#
# This is architectural rule #6 ("the CLI never imports from apps.api") enforced by
# packaging rather than by convention: if someone adds `from apps.api...` to a CLI
# command, a clean `pip install agentbench` breaks on the missing dependency instead
# of silently working on the maintainer's machine.
dependencies = [
    "typer==0.9.4",
    "click==8.1.8",
    "rich==13.7.1",
    "httpx>=0.28.1,<1.0.0",
    "tomli==2.0.1",
    "tomli-w==1.0.0",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
# Everything the control-plane services and workers need. Kept in lockstep with
# apps/api/requirements.txt (which the Dockerfiles use for layer caching);
# tests/unit/test_packaging.py fails if the two drift apart.
api = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.10.1",
    "email-validator>=2.1,<3",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",
    "google-genai==2.10.0",
    "numpy==2.2.6",
    "scikit-learn==1.7.2",
    "confluent-kafka==2.14.2",
    "redis==5.0.8",
    "clickhouse-driver==0.2.9",
    "prometheus-client==0.21.1",
    "opentelemetry-sdk==1.34.1",
    "opentelemetry-instrumentation-fastapi==0.55b1",
    "opentelemetry-exporter-otlp-proto-grpc==1.34.1",
    "APScheduler==3.11.1",
]
dev = [
    "pytest==8.3.4",
]

[project.scripts]
agentbench = "apps.cli.main:app"

[project.urls]
Homepage = "https://github.com/uh-bhinav/RedLine"
Repository = "https://github.com/uh-bhinav/RedLine"
Issues = "https://github.com/uh-bhinav/RedLine/issues"

[tool.setuptools]
# Explicit, not auto-discovered. Auto-discovery would sweep in `agents/` (the
# benchmark agents under test, which are fixtures, not library code) and `apps.api`
# (which must stay out of a CLI-only install).
packages = ["apps", "apps.cli", "apps.cli.commands"]

# NOTE: pytest configuration deliberately lives in pytest.ini, not here. pytest.ini
# takes precedence over [tool.pytest.ini_options], so declaring both would mean one
# of them silently does nothing.
