[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redline"
version = "0.2.0"
description = "RedLine - Agent Reliability Engineering: CI gates, ARS scores, drift and diffs for AI agents"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12", "rich>=13.7", "httpx>=0.27", "tomli>=2.0", "tomli-w>=1.0", "pyyaml>=6.0",
]

[project.scripts]
agentbench = "apps.cli.main:app"

[tool.setuptools.packages.find]
include = ["apps*", "agents*"]
