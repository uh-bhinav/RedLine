upstream eval_service  { server eval_service:8001; }
upstream agent_service { server agent_service:8002; }
upstream gate_service  { server gate_service:8003; }

server {
    listen 8000;
    server_name _;

    # Phase 5.3 -- the dashboard v2 static build, baked into this image by
    # infra/gateway/Dockerfile. Locally (docker-compose), this directory is
    # empty unless the image was actually built (the compose file also mounts
    # this config over a bare nginx:alpine by default for fast config
    # iteration) -- see docker-compose.yml's gateway service.
    root /usr/share/nginx/html;
    index index.html;

    # Pass real client IP through to services for logging/rate-limiting
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Host              $host;

    # Eval Service -- eval runs, CI check, behavioral diff, load testing, failure mining
    location /eval-runs  { proxy_pass http://eval_service;  }
    location /ci         { proxy_pass http://eval_service;  }
    location /diff-runs  { proxy_pass http://eval_service;  }
    location /load-runs  { proxy_pass http://eval_service;  }
    location /mining     { proxy_pass http://eval_service;  }

    # Agent Service -- agent registry, versioning, eval suites
    location /agents     { proxy_pass http://agent_service; }
    location /eval-suites { proxy_pass http://agent_service; }

    # Gate Service -- dashboard reads
    location /dashboard  { proxy_pass http://gate_service;  }

    location /auth { proxy_pass http://eval_service; }

    # Health check handled by the gateway itself -- never routes inward
    location /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"redline-gateway"}';
    }

    # OpenAPI docs from each service (dev convenience -- disable in prod)
    location /eval-service/docs  { proxy_pass http://eval_service/docs;  }
    location /agent-service/docs { proxy_pass http://agent_service/docs; }
    location /gate-service/docs  { proxy_pass http://gate_service/docs;  }

    # SPA fallback -- last, since more specific locations above always win
    # regardless of declaration order (nginx prefix-location matching), but
    # placing it last documents the "fallback" intent for the next reader.
    # try_files serves the built index.html for any client-side route
    # (e.g. /agents/<uuid>) so a deep-link reload doesn't 404.
    location / {
        try_files $uri /index.html;
    }
}