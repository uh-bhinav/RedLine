# Minimal demo infra: postgres, redis, redpanda, clickhouse only.
# Usage: docker compose -f docker-compose.demo.yml up -d --wait
# Does not touch docker-compose.yml. Distinct project/container names so it
# never clashes with the full stack's redline_* containers/volumes.
name: redline-demo

services:
  postgres:
    image: postgres:16-alpine
    container_name: redline_demo_postgres
    environment:
      POSTGRES_USER: redline
      POSTGRES_PASSWORD: redline_dev_password
      POSTGRES_DB: redline
    ports:
      - "5433:5432"
    volumes:
      - demo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redline -d redline"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: redline_demo_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v26.1.11
    container_name: redline_demo_redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://127.0.0.1:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: redline_demo_clickhouse
    environment:
      CLICKHOUSE_DB: redline
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: redline_dev
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - demo_ch_data:/var/lib/clickhouse
      - ./infra/clickhouse-config.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./infra/clickhouse-users.xml:/etc/clickhouse-server/users.d/init-users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password redline_dev --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  demo_pg_data:
  demo_ch_data:
