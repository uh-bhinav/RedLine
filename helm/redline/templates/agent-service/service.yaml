apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: redline
  labels:
    {{- include "redline.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.agentService.port }}
      targetPort: {{ .Values.agentService.port }}