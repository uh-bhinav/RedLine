apiVersion: v1
kind: Secret
metadata:
  name: redline-secrets
  namespace: redline
  labels:
    {{- include "redline.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.infra.databaseUrl | quote }}
  jwt-secret-key: {{ .Values.secrets.jwtSecretKey | quote }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | quote }}
  clickhouse-password: {{ .Values.infra.clickhousePassword | quote }}