apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redline-services
  namespace: redline
  labels:
    {{- include "redline.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: "http"
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - redline