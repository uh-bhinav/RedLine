apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate-service
  namespace: redline
  labels:
    {{- include "redline.labels" . | nindent 4 }}
    app.kubernetes.io/component: gate-service
spec:
  replicas: {{ .Values.gateService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gate-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: gate-service
          image: "{{ .Values.image.registry }}redline-gate_service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateService.port }}
          env:
            {{- include "redline.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.gateService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateService.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateService.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            