apiVersion: v1
kind: Service
metadata:
  name: eval-service
  namespace: redline
  labels:
    {{- include "redline.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: eval-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.evalService.port }}
      targetPort: {{ .Values.evalService.port }}