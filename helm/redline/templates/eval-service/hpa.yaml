{{- if .Values.evalService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eval-service
  namespace: redline
  labels:
    {{- include "redline.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eval-service
  minReplicas: {{ .Values.evalService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.evalService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.evalService.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}