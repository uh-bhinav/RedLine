apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: redline
  labels:
    {{- include "redline.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
---
# Ingress routes traffic from k3d's built-in Traefik ingress controller
# to the nginx gateway service. The cluster was created with
# --port "8000:80@loadbalancer" so localhost:8000 -> port 80 in-cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: redline
  labels:
    {{- include "redline.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: {{ .Values.gateway.port }}