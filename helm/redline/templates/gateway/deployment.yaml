apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-config
  namespace: redline
  labels:
    {{- include "redline.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream eval_service  { server eval-service:{{ .Values.evalService.port }}; }
    upstream agent_service { server agent-service:{{ .Values.agentService.port }}; }
    upstream gate_service  { server gate-service:{{ .Values.gateService.port }}; }

    server {
        listen {{ .Values.gateway.port }};
        server_name _;

        # Phase 5.3 -- dashboard v2 static build, baked into the gateway
        # image by infra/gateway/Dockerfile.
        root /usr/share/nginx/html;
        index index.html;

        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host            $host;

        location /auth       { proxy_pass http://eval_service;  }
        location /eval-runs  { proxy_pass http://eval_service;  }
        location /ci         { proxy_pass http://eval_service;  }
        location /diff-runs  { proxy_pass http://eval_service;  }
        location /load-runs  { proxy_pass http://eval_service;  }
        location /mining     { proxy_pass http://eval_service;  }
        location /agents     { proxy_pass http://agent_service; }
        location /eval-suites { proxy_pass http://agent_service; }
        location /dashboard  { proxy_pass http://gate_service;  }

        location /health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"redline-gateway","env":"k3d"}';
        }

        # SPA fallback -- see infra/gateway.nginx.conf (the dev-compose
        # equivalent) for the full explanation of try_files here.
        location / {
            try_files $uri /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: redline
  labels:
    {{- include "redline.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.registry }}redline-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-nginx-config