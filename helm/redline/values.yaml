image:
  registry: ""
  pullPolicy: IfNotPresent
  tag: "latest"

infra:
  databaseUrl: "postgresql+psycopg2://redline:redline_dev_password@host.k3d.internal:5433/redline"
  redisUrl: "redis://host.k3d.internal:6379/0"
  redpandaBootstrapServers: "host.k3d.internal:29092"
  clickhouseHost: "host.k3d.internal"
  clickhousePort: "9000"
  clickhouseDb: "redline"
  # Phase 5.1: Helm-deployed pods only ever need app-level ClickHouse access
  # (they never run init_clickhouse()) -- admin/superuser creds must never
  # reach the cluster.
  clickhouseUser: "redline_app"
  clickhousePassword: "redline_app_dev_password"
  otelExporterEndpoint: "http://host.k3d.internal:4317"

evalService:
  replicaCount: 1
  port: 8001
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

agentService:
  replicaCount: 1
  port: 8002
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

gateService:
  replicaCount: 1
  port: 8003
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

worker:
  lagThreshold: "5"
  minReplicas: 1
  maxReplicas: 8
  resources:
    requests:
      cpu: "100m"
      memory: "384Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# Phase 4 Section 5 -- deliberately a SEPARATE profile from eval-worker, not a
# shared one. A load-runner thread pool holds many concurrent outbound
# connections (CPU/memory shape closer to a real load generator) while an
# eval-worker spends ~95% of its time blocked on one LLM call at a time
# (foundational doc §9.3's whole point: heterogeneous worker pools scale
# independently because their resource profiles are actually different, not
# just organizationally different).
loadWorker:
  lagThreshold: "1"
  minReplicas: 0
  maxReplicas: 4
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

gateway:
  port: 80

secrets:
  jwtSecretKey: "change_this_to_a_long_random_string"
  geminiApiKey: ""
  postgresUser: "redline"
  postgresPassword: "redline_dev_password"
  postgresDb: "redline"