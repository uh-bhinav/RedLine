services:
  postgres:
    image: postgres:16-alpine
    container_name: redline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: redline
      POSTGRES_PASSWORD: redline
      POSTGRES_DB: redline
    ports:
      - "5433:5432"
    volumes:
      - redline_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redline_pg_data: