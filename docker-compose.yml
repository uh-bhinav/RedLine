services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: redline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - redline_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: redline_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:5432"

  redis:
    image: redis:7-alpine
    container_name: redline_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redline_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v26.1.11
    container_name: redline_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      # Three listeners, not two: "external" advertises localhost:19092 for
      # clients on the Mac host (e.g. a locally-run worker process); a single
      # external listener CANNOT also serve k3d pods, because pods that connect
      # via host.k3d.internal:19092 still get told (via Kafka's own metadata
      # protocol) to reconnect to whatever address is advertised -- "localhost"
      # from inside a pod is the pod itself, not the Mac, so every call after
      # the initial bootstrap failed with "Connection refused". This is Bug 2:
      # confirmed still present 2026-07-29 (Phase 4.5 cleanup) via real
      # eval-worker/load-worker pod logs on a live k3d cluster before this fix.
      # "k3d" is a dedicated third listener solely for in-cluster pods.
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092,k3d://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092,k3d://host.k3d.internal:29092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "29092:29092"
      - "18082:18082"
      - "9644:9644"
    volumes:
      - redline_redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redline_redpanda_console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    volumes:
      - ./infra/redpanda-console-config.yml:/tmp/config.yml:ro
    ports:
      - "8080:8080"

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: redline_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: redline
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: redline_dev
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - redline_ch_data:/var/lib/clickhouse
      - redline_ch_logs:/var/log/clickhouse-server
      - ./infra/clickhouse-config.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./infra/clickhouse-users.xml:/etc/clickhouse-server/users.d/init-users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password redline_dev --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  eval_service:
    build:
      context: .
      dockerfile: apps/eval_service/Dockerfile
    container_name: redline_eval_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      REDPANDA_BOOTSTRAP_SERVERS: "redpanda:9092"
      CLICKHOUSE_HOST: "clickhouse"
      OTEL_EXPORTER_ENDPOINT: "http://tempo:4317"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"localhost\",8001),2)'"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent_service:
    build:
      context: .
      dockerfile: apps/agent_service/Dockerfile
    container_name: redline_agent_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      REDPANDA_BOOTSTRAP_SERVERS: "redpanda:9092"
      CLICKHOUSE_HOST: "clickhouse"
      OTEL_EXPORTER_ENDPOINT: "http://tempo:4317"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"localhost\",8002),2)'"]
      interval: 10s
      timeout: 5s
      retries: 5

  gate_service:
    build:
      context: .
      dockerfile: apps/gate_service/Dockerfile
    container_name: redline_gate_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      REDPANDA_BOOTSTRAP_SERVERS: "redpanda:9092"
      CLICKHOUSE_HOST: "clickhouse"
      OTEL_EXPORTER_ENDPOINT: "http://tempo:4317"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      tempo:
        condition: service_started
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"localhost\",8003),2)'"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.5.0
    container_name: redline_tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo.yaml:/etc/tempo.yaml:ro
      - redline_tempo_data:/var/tempo
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "3200:3200"   # Tempo query API (Grafana datasource target)

  # ─── API Gateway ─────────────────────────────────────────────────────────────
  gateway:
    # Phase 5.3 -- custom image baking in the dashboard's static SPA build
    # (infra/gateway/Dockerfile), replacing the bare nginx:alpine image. The
    # config volume mount below still overrides infra/gateway.nginx.conf at
    # container start, so local nginx-config iteration doesn't need a rebuild
    # -- only the baked-in dist/ (the dashboard build itself) needs one.
    build:
      context: .
      dockerfile: infra/gateway/Dockerfile
    container_name: redline_gateway
    restart: unless-stopped
    depends_on:
      eval_service:
        condition: service_healthy
      agent_service:
        condition: service_healthy
      gate_service:
        condition: service_healthy
    ports:
      - "8085:8000"
    volumes:
      - ./infra/gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redline_pg_data:
  redline_redis_data:
  redline_redpanda_data:
  redline_ch_data:
  redline_ch_logs:
  redline_tempo_data: