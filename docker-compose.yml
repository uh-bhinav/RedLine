services:
  postgres:
    image: postgres:16-alpine
    container_name: redline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - redline_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redline_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redline_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v26.1.11
    container_name: redline_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18082:18082"
      - "9644:9644"
    volumes:
      - redline_redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redline_redpanda_console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    volumes:
      - ./infra/redpanda-console-config.yml:/tmp/config.yml:ro
    ports:
      - "8080:8080"

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: redline_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: redline
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: redline_dev
    ports:
      - "8123:8123"   # HTTP interface (curl-able for quick queries)
      - "9000:9000"   # native TCP interface (clickhouse-driver)
    volumes:
      - redline_ch_data:/var/lib/clickhouse
      - redline_ch_logs:/var/log/clickhouse-server
      - ./infra/clickhouse-config.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./infra/clickhouse-users.xml:/etc/clickhouse-server/users.d/memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password redline_dev --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  redline_pg_data:
  redline_redis_data:
  redline_redpanda_data:
  redline_ch_data:
  redline_ch_logs: